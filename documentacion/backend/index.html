<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documentación API Backend - Custom Layers</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f8f9fa; }
        .topbar { background: #1e293b; padding: 15px 30px; display: flex; align-items: center; }
        .topbar a { color: white; text-decoration: none; font-weight: bold; font-size: 16px; }
        .topbar a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../index.html">⬅ Volver al Menú Principal</a>
    </div>
    <div id="swagger-ui"></div>
    
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: "./openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [ SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset ],
                layout: "BaseLayout"
            });
        };
    </script>
</body>
</html>
