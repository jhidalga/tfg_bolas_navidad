<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Mantenimiento - Custom Layers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            border-color: #3b82f6;
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(59, 130, 246, 0.1);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 0 0 10px 0;
            color: #1e293b;
        }

        .card p {
            font-size: 14px;
            margin: 0;
        }

        .btn {
            margin-top: 20px;
            display: inline-block;
            padding: 8px 20px;
            background: #3b82f6;
            color: white;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Custom Layers</h1>
        <p>Centro de Documentación Técnica del Proyecto</p>

        <div class="grid">
            <a href="frontend/index.html" class="card">
                <div class="icon">📱</div>
                <h2>Frontend (App Móvil)</h2>
                <p>Interfaces, componentes, navegación y vistas (React Native + Expo).</p>
                <div class="btn">Ver TypeDoc</div>
            </a>

            <a href="backend/index.html" class="card">
                <div class="icon">⚙️</div>
                <h2>Backend (API)</h2>
                <p>Endpoints, rutas, esquemas de datos y lógica de servidor (FastAPI).</p>
                <div class="btn">Ver Swagger</div>
            </a>
        </div>
    </div>
</body>

</html>
